# Copy this file, edit paths and parameters, then run:
# python run_pipeline.py pipeline.yml
# Relative paths are resolved from the YAML file's directory.
input_segy: /home/ammir/Desktop/Seismic_Dataset/Forge/2018-19_Reflection_Processing/3D_Survey/Forge3d_ANI_PSDM_Stack_UnEnh.segy
output_segy: Forge3d_ANI_PSDM_Stack_UnEnh_Footprint_atten.segy
cache_directory: .destriping_cache  # saved arrays, masks, coefficients, and temporary work
on_existing: prompt  # ask whether to reuse or recalculate saved maps
# For unattended runs, use on_existing: reuse or on_existing: recalculate.
# Without cache_directory, .destriping_cache is created beside output_segy.

geometry:
  # Physical distance between adjacent grid lines in meters, supplied by you.
  inline_spacing_m: 25.0
  crossline_spacing_m: 25.0

rms:
  window_mode: constant
  vertical_domain: depth  # depth in meters for this PSDM SEG-Y
  # The same windows setting works in constant and horizon modes.
  # In constant mode these are absolute limits; in horizon mode they are
  # offsets from each horizon pick. -1 means the final SEG-Y sample.
  windows:
    - [0.0, 1400.0]
    - [1401.0, 1800.0]
  # For consecutive 100-unit windows from 1 to the end, use:
  #   - [1.0, -1, 100.0]
  # This generates [1, 101], [101, 201], ... and a final [top, -1].
  # For 0 to 1400 in 100-unit windows, use: - [0.0, 1400.0, 100.0]
  # You may mix stepped entries and custom pairs, for example:
  #   - [1400.0, 2800.0]
  #   - [2800.0, -1]
  # For time data use vertical_domain: time and limits in milliseconds.
  # To use a horizon, set window_mode: horizon above and provide these settings:
  # horizon_file: /path/to/horizon.txt
  # horizon_z_unit: m  # ms or s for time; m or ft for depth
  # For horizon + 1800 to the end, replace windows with [[1800.0, -1]].
  # A stepped horizon range also uses [start, end, step]; end: -1 reaches
  # the SEG-Y end, so late windows may cover fewer traces.
  horizon_delimiter: auto  # whitespace, tab, comma, semicolon, pipe, fixed
  horizon_columns: null  # or [inline_column, crossline_column, z_column], zero-based
  horizon_fixed_widths: null  # e.g. [8, 8, 12] for fixed-width data
  horizon_skip_rows: 0
  horizon_missing_values: ["NaN"]
  horizon_decimal: "."
  horizon_encoding: utf-8-sig
  # If the SEG-Y sample increment/start is incorrect for this domain, set
  # these overrides in ms (time) or m (depth):
  sample_interval_override: null
  sample_start_override: null
  # If you change windows, choose recalculate at the saved-map prompt.
  # To use existing RMS maps, provide their paths and coordinate axes.
  # List one map for each generated or explicit window, in order.
  # existing_maps: [/path/to/constant_rms.npy]
  # inlines_file: /path/to/Inlines.npy
  # crosslines_file: /path/to/Crosslines.npy

mask:
  mode: interactive  # draw boundary/holes; multiple masks prefill the previous boundary only
  # scope: multiple  # optional: single or multiple; omit to choose when step 2 recalculates
  preview_map_index: 0  # zero-based RMS map index to show when drawing
  pad_inline_meters: 3000.0
  pad_crossline_meters: 1000.0
  # To reuse completed blending, set existing_blended_maps to the .npy paths
  # for each RMS window, with matching _window.npz, _mask.npy, and _taper.npy files.
  # existing_blended_maps: [/path/to/blended_rms.npy]
  # For a noninteractive run, set mode: vertices and provide coordinates:
  # outer: [[200, 100], [300, 100], [300, 200], [200, 200]]
  # holes:
  #   - [[240, 140], [260, 140], [260, 160], [240, 160]]
  # Coordinates are [crossline, inline], matching the polygon plot axes.

attenuation:
  save_pass_pngs: true  # save input, every accepted pass output, and final coefficient PNG per RMS map
  png_output_directory: ./destriping_pngs  # created automatically when save_pass_pngs is true
  parameter_input_mode: hardcoded  # hardcoded or interactive for per-pass QC and prompts
  # Two suggested passes. Each tuple is (f1, f2, f3, a1): filter lengths
  # in meters, then the standard-deviation multiplier. Each filter runs twice
  # in the fixed order inline, crossline, crossline.
  pass_parameters:
    - [500.0, 2000.0, 8000.0, 2.0]
    - [1000.0, 4000.0, 16000.0, 2.0]
  alpha: 0.3
  pad_inline_meters: 3000.0
  pad_crossline_meters: 200.0
  filter_il_meters: 2000.0  # Boundary ramp; attenuation runs through its nonzero part
  filter_xl_meters: 2000.0
  hole_filter_il_meters: 100.0     # Dedicated hole ramp
  hole_filter_xl_meters: 100.0
  preview_hardcoded_passes: true  # true: close each plot, then accept or enter a replacement tuple in the terminal
  colormap_file: null  # optional .alut path; viridis if unavailable

application:
  overwrite_output: true
  write_segy: true  # false: inspect pass previews/PNGs and coefficients without writing SEG-Y
